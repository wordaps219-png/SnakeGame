<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Snake Game - Simple</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: Arial, sans-serif;
            overflow: hidden;
            touch-action: none;
        }
        
        .game-container {
            text-align: center;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            max-width: 95vw;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
        }
        
        .score {
            font-size: 18px;
            color: #667eea;
            margin-bottom: 10px;
            font-weight: bold;
        }
        
        canvas {
            border: 3px solid #667eea;
            border-radius: 10px;
            background: #f0f0f0;
            display: block;
            margin: 0 auto;
            max-width: 100%;
        }
        
        .controls-info {
            margin-top: 15px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            color: #666;
            font-size: 14px;
        }
        
        .control-type {
            display: inline-block;
            margin: 5px 10px;
            padding: 5px 10px;
            background: #667eea;
            color: white;
            border-radius: 15px;
            font-size: 12px;
        }
        
        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 5px;
            transition: all 0.3s;
            font-weight: bold;
        }
        
        .btn:hover {
            background: #764ba2;
            transform: translateY(-2px);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            max-width: 90vw;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        .modal h2 {
            color: #e74c3c;
            margin-bottom: 15px;
            font-size: 28px;
        }
        
        .modal p {
            margin: 10px 0;
            font-size: 18px;
            color: #333;
        }
        
        .final-score {
            font-size: 24px;
            color: #667eea;
            font-weight: bold;
            margin: 15px 0;
        }
        
        .hidden {
            display: none !important;
        }
        
        .start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .start-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            max-width: 90vw;
        }
        
        .start-content h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 28px;
        }
        
        .instructions {
            margin: 20px 0;
            text-align: left;
        }
        
        .instruction-item {
            margin: 10px 0;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        
        @media (max-width: 600px) {
            .game-container {
                padding: 15px;
                margin: 10px;
            }
            
            h1 {
                font-size: 20px;
            }
            
            .btn {
                padding: 10px 20px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <!-- Start Screen -->
    <div class="start-screen" id="startScreen">
        <div class="start-content">
            <h2>🐍 Snake Game</h2>
            <div class="instructions">
                <div class="instruction-item">
                    <strong>💻 Laptop/PC:</strong><br>
                    Gunakan tombol panah ⬆️⬇️⬅️➡️ untuk menggerakkan snake
                </div>
                <div class="instruction-item">
                    <strong>📱 HP/Tablet:</strong><br>
                    Swipe layar ke arah yang diinginkan
                </div>
            </div>
            <button class="btn" id="startButton" type="button">Mulai Bermain</button>
        </div>
    </div>

    <!-- Game Over Modal -->
    <div class="modal hidden" id="gameOverModal">
        <div class="modal-content">
            <h2>Game Over!</h2>
            <p>Skor Akhir Anda:</p>
            <div class="final-score" id="finalScore">0</div>
            <button class="btn" id="playAgainButton" type="button">Main Lagi</button>
            <button class="btn" id="closeModalButton" type="button">OK</button>
        </div>
    </div>

    <!-- Main Game Container -->
    <div class="game-container">
        <h1>🐍 Snake Game</h1>
        <div class="score">Skor: <span id="score">0</span></div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        
        <div class="controls-info">
            <div class="control-type">💻 Panah Arah</div>
            <div class="control-type">📱 Swipe Layar</div>
        </div>
        
        <button class="btn" id="restartButton" type="button">Mulai Ulang</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const finalScoreElement = document.getElementById('finalScore');
        const gameOverModal = document.getElementById('gameOverModal');
        const startScreen = document.getElementById('startScreen');

        // Tombol: gunakan Pointer Events agar kompatibel dengan HP,
        // tablet, mouse, dan keyboard tanpa double-trigger click/touch.
        const startButton = document.getElementById('startButton');
        const playAgainButton = document.getElementById('playAgainButton');
        const closeModalButton = document.getElementById('closeModalButton');
        const restartButton = document.getElementById('restartButton');
        
        // Ukuran grid
        const gridSize = 20;
        let tileCount = 20; // Akan disesuaikan dengan ukuran canvas
        
        // Variabel game
        let snake = [];
        let food = {};
        let dx = 0;
        let dy = 0;
        let score = 0;
        let gameRunning = false;
        let gameStarted = false;
        
        // Untuk swipe detection
        let touchStartX = 0;
        let touchStartY = 0;
        
        // Inisialisasi canvas size
        function initCanvas() {
            if (window.innerWidth < 500) {
                canvas.width = 300;
                canvas.height = 300;
            } else {
                canvas.width = 400;
                canvas.height = 400;
            }
            tileCount = canvas.width / gridSize;
        }
        
        // Generate makanan random
        function generateFood() {
            food = {
                x: Math.floor(Math.random() * tileCount),
                y: Math.floor(Math.random() * tileCount)
            };
            
            // Pastikan makanan tidak muncul di tubuh snake
            for (let segment of snake) {
                if (segment.x === food.x && segment.y === food.y) {
                    generateFood();
                    return;
                }
            }
        }
        
        // Gambar elemen game
        function draw() {
            // Clear canvas
            ctx.fillStyle = '#f0f0f0';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Gambar grid
            ctx.strokeStyle = '#ddd';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, canvas.height);
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(0, i * gridSize);
                ctx.lineTo(canvas.width, i * gridSize);
                ctx.stroke();
            }
            
            // Gambar snake
            for (let i = 0; i < snake.length; i++) {
                if (i === 0) {
                    // Kepala snake
                    ctx.fillStyle = '#764ba2';
                } else {
                    // Tubuh snake
                    ctx.fillStyle = '#667eea';
                }
                ctx.fillRect(snake[i].x * gridSize + 1, snake[i].y * gridSize + 1, gridSize - 2, gridSize - 2);
            }
            
            // Gambar makanan
            ctx.fillStyle = '#e74c3c';
            ctx.beginPath();
            ctx.arc(
                food.x * gridSize + gridSize/2, 
                food.y * gridSize + gridSize/2, 
                gridSize/2 - 2, 
                0, 
                Math.PI * 2
            );
            ctx.fill();
        }
        
        // Update posisi snake
        function update() {
            if (!gameRunning || !gameStarted) return;
            
            // Hanya update jika ada arah gerakan
            if (dx === 0 && dy === 0) return;
            
            // Hitung posisi kepala baru
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            
            // Cek tabrakan dengan dinding
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                gameOver();
                return;
            }
            
            // Cek tabrakan dengan tubuh sendiri
            for (let segment of snake) {
                if (head.x === segment.x && head.y === segment.y) {
                    gameOver();
                    return;
                }
            }
            
            // Tambahkan kepala baru
            snake.unshift(head);
            
            // Cek apakah makan makanan
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.textContent = score;
                generateFood();
            } else {
                // Hapus ekor jika tidak makan
                snake.pop();
            }
        }
        
        // Game over
        function gameOver() {
            gameRunning = false;
            finalScoreElement.textContent = score;
            gameOverModal.classList.remove('hidden');
        }
        
        // Close modal
        function closeModal() {
            gameOverModal.classList.add('hidden');
        }
        
        // Reset game
        function resetGame() {
            snake = [{x: Math.floor(tileCount/2), y: Math.floor(tileCount/2)}];
            dx = 0;
            dy = 0;
            score = 0;
            scoreElement.textContent = score;
            gameRunning = true;
            gameStarted = true;
            gameOverModal.classList.add('hidden');
            generateFood();
            draw();
        }
        
        // Start game
        function startGame() {
            startScreen.classList.add('hidden');
            resetGame();
        }
        
        // Kontrol keyboard
        document.addEventListener('keydown', (e) => {
            if (!gameRunning || !gameStarted) return;
            
            switch(e.key) {
                case 'ArrowUp':
                    if (dy !== 1) { dx = 0; dy = -1; }
                    break;
                case 'ArrowDown':
                    if (dy !== -1) { dx = 0; dy = 1; }
                    break;
                case 'ArrowLeft':
                    if (dx !== 1) { dx = -1; dy = 0; }
                    break;
                case 'ArrowRight':
                    if (dx !== -1) { dx = 1; dy = 0; }
                    break;
            }
        });
        
        // Kontrol swipe untuk HP/tablet menggunakan Pointer Events.
        // Pointer Events lebih konsisten daripada kombinasi touchstart/touchend.
        let pointerStartX = 0;
        let pointerStartY = 0;
        let pointerTracking = false;

        canvas.addEventListener('pointerdown', (e) => {
            if (e.pointerType === 'mouse' && e.button !== 0) return;

            pointerTracking = true;
            pointerStartX = e.clientX;
            pointerStartY = e.clientY;

            // Meminta pointer tetap ditangani canvas meskipun jari bergerak.
            if (canvas.setPointerCapture) {
                try {
                    canvas.setPointerCapture(e.pointerId);
                } catch (_) {}
            }

            e.preventDefault();
        }, { passive: false });

        canvas.addEventListener('pointerup', (e) => {
            if (!pointerTracking) return;
            pointerTracking = false;

            e.preventDefault();

            if (!gameRunning || !gameStarted) return;

            const deltaX = e.clientX - pointerStartX;
            const deltaY = e.clientY - pointerStartY;
            const minSwipeDistance = 30;

            // Abaikan tap pendek; hanya swipe yang mengubah arah.
            if (Math.max(Math.abs(deltaX), Math.abs(deltaY)) < minSwipeDistance) {
                return;
            }

            if (Math.abs(deltaX) > Math.abs(deltaY)) {
                // Swipe horizontal
                if (deltaX > 0 && dx !== -1) {
                    dx = 1;
                    dy = 0;
                } else if (deltaX < 0 && dx !== 1) {
                    dx = -1;
                    dy = 0;
                }
            } else {
                // Swipe vertikal
                if (deltaY > 0 && dy !== -1) {
                    dx = 0;
                    dy = 1;
                } else if (deltaY < 0 && dy !== 1) {
                    dx = 0;
                    dy = -1;
                }
            }
        }, { passive: false });

        canvas.addEventListener('pointercancel', () => {
            pointerTracking = false;
        }, { passive: true });

        // Jangan biarkan browser melakukan scrolling/gesture native
        // ketika jari digunakan untuk bermain di canvas.
        canvas.style.touchAction = 'none';

        // Tombol memakai Pointer Events agar tap HP tidak bermasalah.
        function bindPointerButton(button, handler) {
            if (!button) return;

            button.addEventListener('pointerup', (e) => {
                if (e.pointerType === 'mouse' && e.button !== 0) return;
                e.preventDefault();
                handler();
            }, { passive: false });

            // Aksesibilitas keyboard (Enter/Space).
            button.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    handler();
                }
            });
        }

        bindPointerButton(startButton, startGame);
        bindPointerButton(playAgainButton, resetGame);
        bindPointerButton(closeModalButton, closeModal);
        bindPointerButton(restartButton, resetGame);
        
        // Game loop
        function gameLoop() {
            update();
            draw();
        }
        
        // Mulai game
        initCanvas();
        setInterval(gameLoop, 150);
        
        // Responsif canvas untuk mobile
        window.addEventListener('resize', () => {
            initCanvas();
            if (gameStarted) {
                draw();
            }
        });
        
        // Initial draw
        draw();
    </script>
</body>
</html>
